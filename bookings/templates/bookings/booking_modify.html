{% extends 'base.html' %}
{% block content %}
<div class="page-wrap max-w-lg">
    <p class="font-body text-sm tracking-widest uppercase text-maple mb-3">Modify Booking</p>
    <h1 class="page-header">Update Your Details</h1>
    <p class="text-concrete mb-10">
        Need to change your date, time, or party size instead? Please cancel this booking and make a new one.
    </p>
    <div class="card">
        <form method="post">
            {% csrf_token %}
            <div>
                <label for="{{ form.seating_preference.id_for_label }}">Seating Preference</label>
                {{ form.seating_preference }}
            </div>
            <div>
                <label for="{{ form.special_requests.id_for_label }}">Special Requests</label>
                {{ form.special_requests }}
            </div>
            <div class="flex gap-4 mt-6">
                <a href="{% url 'booking_manage' booking.manage_token %}" class="btn-secondary">Cancel</a>
                <button type="submit" class="btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
