{% extends 'base.html' %}

{% block content %}
<div class="page-wrap max-w-lg text-center">
    <h1 class="page-header">Payment Received</h1>
    <div class="card">
        <p class="mb-4">Thank you - your deposit has been received and your table is confirmed.</p>
        <p class="text-sm text-concrete">{{ booking.date }} at {{ booking.time|time:"g:i A" }} - party of {{ booking.party_size }}.</p>
        <a href="{% url 'booking_manage' booking.manage_token %}" class="btn-link mt-6 inline-block">View Booking</a>
    </div>
</div>
{% endblock %}
