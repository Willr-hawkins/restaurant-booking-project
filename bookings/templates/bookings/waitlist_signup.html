{% extends 'base.html' %}

{% block content %}
<div class="page-wrap max-w-lg">
    <h1 class="page-header">Join the Waitlist</h1>
    <p class="text-concrete text-sm mb-6">We'll email you if a table frees up matching your details.</p>
    <div class="card">
        <form method="post">
            {% csrf_token %}
            <div>
                <label for="{{ form.guest_name.id_for_label }}">Full Name</label>
                {{ form.guest_name }}
            </div>
            <div>
                <label for="{{ form.guest_email.id_for_label }}">Email</label>
                {{ form.guest_email }}
            </div>
            <div>
                <label for="{{ form.guest_phone.id_for_label }}">Phone Number</label>
                {{ form.guest_phone }}
            </div>
            <div>
                <label for="{{ form.date.id_for_label }}">Date</label>
                {{ form.date }}
            </div>
            <div>
                <label for="{{ form.time.id_for_label }}">Preferred Time</label>
                {{ form.time }}
            </div>
            <div>
                <label for="{{ form.party_size.id_for_label }}">Party Size</label>
                {{ form.party_size }}
            </div>
            <div>
                <label for="{{ form.notes.id_for_label }}">Notes</label>
                {{ form.notes }}
            </div>
            <button type="submit" class="btn-primary mt-6">Join Waitlist</button>
        </form>
    </div>
</div>
{% endblock %}
