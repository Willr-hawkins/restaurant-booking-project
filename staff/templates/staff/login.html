{% extends 'base.html' %}
{% block content %}
<div class="page-wrap flex justify-center">
    <div class="card w-full max-w-sm">
        <h1 class="page-header text-2xl">Staff Login</h1>
        {% if error %}
            <p class="text-vermillion text-sm mb-2">{{ error }}</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label for="username">Username</label>
            <input type="text" name="username" id="username">
            <label for="password">Password</label>
            <input type="password" name="password" id="password">
            <button type="submit" class="btn-primary mt-6 w-full text-center">Log In</button>
        </form>
    </div>
</div>
{% endblock %}
