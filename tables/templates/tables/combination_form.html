{% extends "base.html" %}

{% block content %}
<div class="page-wrap max-w-md">
    <h1 class="page-header text-2xl">{{ title }}</h1>
    <div class="card mt-6">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-primary mt-6">Save</button>
        </form>
    </div>
</div>
{% endblock %}
