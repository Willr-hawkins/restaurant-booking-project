{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="page-wrap">
    <div class="flex items-center justify-between mb-2">
        <div>
            <p class="text-xs uppercase tracking-widest text-maple mb-2">Staff</p>
            <h1 class="page-header mb-0">Floor Plan Editor</h1>
        </div>
        <a href="{% url 'table_list' %}" class="btn-link">Manage tables →</a>
    </div>
    <p class="text-concrete mb-8">Drag tables into place to match your room layout.</p>

    <div id="floor-canvas"
         class="relative bg-paper border border-concrete rounded-lg"
         style="width: 900px; height: 500px; max-width: 100%; background-image: radial-gradient(circle, rgba(173, 166, 156, 0.35) 1px, transparent 1px); background-size: 20px 20px;">
    </div>
</div>

<script src="{% static 'js/floor-plan-editor.js' %}"></script>
{% endblock %}
