{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="page-wrap">
    <div class="flex items-center justify-between mb-2">
        <div>
            <p class="text-xs uppercase tracking-widest text-maple mb-2">Staff</p>
            <h1 class="page-header mb-0">Floor Status</h1>
        </div>
        <a href="{% url 'floor_plan_editor' %}" class="btn-link">Edit floor plan →</a>
    </div>
    <p class="text-concrete mb-6">A live view of what's seated, turning, or free right now.</p>

    <div class="flex gap-6 mb-6 text-sm">
        <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full inline-block bg-concrete"></span> Free</div>
        <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full inline-block bg-maple"></span> Turning soon</div>
        <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full inline-block bg-vermillion"></span> Seated</div>
    </div>

    <div id="floor-canvas"
         class="relative bg-paper border border-concrete rounded-lg"
         style="width: 900px; height: 500px; max-width: 100%; background-image: radial-gradient(circle, rgba(173, 166, 156, 0.35) 1px, transparent 1px); background-size: 20px 20px;">
    </div>
</div>

<script src="{% static 'js/floor-status.js' %}"></script>
{% endblock %}
